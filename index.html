<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100F">
<meta name="description" content="Lumière by Les Fleurs de la Nuit: add and shape light in your photographs, on your phone.">
<title>Lumière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Tokens and components come from the "Darkroom" design system; this page adds layout only. -->
<link rel="stylesheet" href="design-system/styles.css">
<style>
/* Layout: the photograph fills the screen. One bottom sheet moves between three states:
   a small bar → the list of lights → the editor for one light. */
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.4 var(--font-body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  --gl: max(var(--sp-16), env(safe-area-inset-left, 0px)); --gr: max(var(--sp-16), env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: inherit; }
input { -webkit-user-select: text; user-select: text; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
canvas.stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#ov { pointer-events: none; }

/* top bar */
#top { position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-appbar); height: calc(var(--appbar-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(var(--sp-4), env(safe-area-inset-right, 0px)) 0 max(var(--sp-12), env(safe-area-inset-left, 0px)); }
#mark { display: grid; gap: 1px; line-height: 1; }
#mark small { font: 400 10px var(--font-body); letter-spacing: .02em; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#exportBtn { margin: 0 var(--sp-4) 0 var(--sp-4); }

/* floating readouts and the snackbar */
.float { position: fixed; z-index: var(--z-fab); top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h) + var(--sp-4)); font: 500 11px/1 var(--font-mono); border-radius: var(--r-md); padding: var(--sp-8); }
#perf { left: var(--gl); color: var(--text-secondary); background: color-mix(in srgb, var(--bg) 82%, transparent); box-shadow: var(--elev-1); font-variant-numeric: tabular-nums; }
#perf b { color: var(--text); font-weight: 500; }
#perf.good b.fps { color: var(--success); } #perf.ok b.fps { color: var(--warning); } #perf.slow b.fps { color: var(--error); }
#soloTag { right: var(--gr); background: var(--primary-container); color: var(--on-primary-container); }
#toast { position: fixed; z-index: var(--z-snackbar); left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h) + var(--sp-8)); max-width: min(420px, calc(100% - 32px)); }
#toast.plain { padding-right: var(--sp-16); }

/* the sheet */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-drawer); overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
#grab { display: block; width: 100%; height: 24px; touch-action: none; cursor: grab; }
#grab .grabber { margin: var(--sp-8) auto 0; }
#panel, .ghost { max-height: min(46vh, 400px); overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--gr) var(--sp-12) var(--gl); display: grid; gap: var(--sp-12); align-content: start; }
#sheet.tall #panel, #sheet.tall .ghost { max-height: min(74vh, 680px); }
#sheet.peek #panel { display: none; }
#peek { padding: var(--sp-8) var(--gr) var(--sp-16) var(--gl); }
#peek b { color: var(--primary); font-weight: 500; }
.ghost { position: absolute; left: 0; right: 0; pointer-events: none; overflow: hidden; }
.sticky { position: sticky; top: 0; z-index: 2; background: var(--paper); display: grid; gap: var(--sp-4); padding-bottom: var(--sp-4); }
.tabpanel { display: grid; gap: var(--sp-12); align-content: start; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-8); padding-top: var(--sp-4); }
.bar .btn { justify-content: flex-start; }
.bar .count { margin-left: auto; }

/* light list */
#lights { display: grid; gap: var(--sp-4); }
.layer-row { position: relative; transition: transform var(--dur-shorter) var(--ease); }
.layer-row.dragging { transition: none; z-index: 3; }
#lights.sorting { touch-action: none; }
.layer-row .thumb { display: block; object-fit: cover; pointer-events: none; -webkit-touch-callout: none; }
.layer-row .name { min-width: 0; min-height: var(--target); padding: var(--sp-8) 0; text-align: left; -webkit-touch-callout: none; }
.layer-row .name > span, .opts .pri, .opts .sec { display: block; }
.base-row { grid-template-columns: var(--target) 48px minmax(0, 1fr) auto; background: transparent; }
.base-row .dims { display: grid; place-items: center; text-align: center; font-size: 10px; }

/* editor */
.ed-head { display: grid; grid-template-columns: var(--target) minmax(0, 1fr) var(--target) var(--target); align-items: center; margin: 0 calc(var(--sp-8) * -1); touch-action: pan-y; }
.ed-head .ttl { min-width: 0; padding: 0 var(--sp-4); }
.ed-head .t-h5, .ed-head .t-mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-head .t-mono { font-size: 11px; }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--sp-12); }
.q .chip { margin-bottom: 6px; }
.tab { position: relative; }

/* sliders: the design-system slider drawn over a native range input (keyboard, touch, screen readers) */
.slider .rail input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: pan-y; }
.slider .rail input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 44px; }
.slider .rail input::-moz-range-thumb { width: 20px; height: 44px; border: 0; }
.slider .fill { left: 0; width: calc(10px + (100% - 20px) * var(--p, 0)); }
.slider .thumb { left: calc(10px + (100% - 20px) * var(--p, 0)); transition: box-shadow var(--dur-fast) var(--ease); }
.slider:focus-within .thumb, .slider .rail:active .thumb { box-shadow: 0 0 0 4px var(--paper), 0 0 0 8px var(--action-focus); }
.slider .head output { color: var(--text-secondary); }

.switch.line { display: flex; width: 100%; justify-content: space-between; gap: var(--sp-12); text-align: left; }
.btn[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); }
.addbtn { justify-self: start; }
.toggle { position: relative; } .toggle::before { content: ""; position: absolute; inset: -2px 0; } /* 40px toggles inside a 2px track: the track counts toward the 44px target */
.t-mono b { color: var(--warning); font-weight: 500; }
.swatch { position: relative; }
.swatch.custom i { background: conic-gradient(from 90deg, #ff6b6b, #ffd36b, #7bf0a0, #6bc8ff, #b48bff, #ff6b6b); }
.swatch.custom.on i { background: var(--sw); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--primary); }
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.swatch:focus-within { box-shadow: var(--focus-ring); border-radius: var(--r-md); }
.libs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-8); }
.libs > * { position: relative; display: grid; gap: var(--sp-4); font: 500 11px var(--font-body); color: var(--text-secondary); text-align: center; cursor: pointer; }
.libs img, .libs .add { width: 100%; aspect-ratio: 1; border-radius: var(--r-md); background: var(--sunken); object-fit: cover; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--hairline); }
.libs [aria-pressed="true"] { color: var(--text); }
.libs [aria-pressed="true"] img { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--primary); }
.libs label:focus-within .add { box-shadow: var(--focus-ring); }
.accordion .sum { cursor: default; }
.accordion .what { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-8); min-height: var(--target); text-align: left; }
.accordion .what .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 14px var(--font-body); color: var(--text); }
.accordion .what .ico:first-child { color: var(--text-secondary); }
.det-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4); }

/* menus */
#pop { position: fixed; z-index: 1350; max-height: 62vh; overflow-y: auto; }
#pop .mi { width: 100%; text-align: left; }
#pop .mi[disabled] { color: var(--text-disabled); cursor: default; }
#pop .mi[disabled] .ico { color: var(--text-disabled); }
#pop .mi .ok { color: var(--primary); margin-left: auto; }

/* modal sheets */
#modal { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--scrim); display: grid; place-items: end center; }
.mcard { width: min(560px, 100%); max-height: 86vh; overflow-y: auto; padding: 0 var(--gr) calc(env(safe-area-inset-bottom, 0px) + var(--sp-12)) var(--gl); display: grid; gap: var(--sp-12); }
.mcard .actions { display: flex; justify-content: flex-end; gap: var(--sp-8); }
.opts .list-item { width: 100%; text-align: left; }
.opts .list-item > .ico { color: var(--primary); }
.opts .list-item > .t-mono { color: var(--primary); }
.preset { display: grid; align-content: start; width: 100%; text-align: left; }
.preset .media { display: block; aspect-ratio: 16 / 10; }
.preset .content { display: grid; gap: 2px; padding: var(--sp-8) 10px 10px; }
.field .ctl input { flex: 1; min-width: 0; height: var(--target); background: none; border: 0; outline: 0; }
.field input:focus-visible { box-shadow: none; }
.field:focus-within .ctl { box-shadow: inset 0 -2px 0 var(--primary); }
.field:focus-within .lbl { color: var(--primary); }
img.result { max-width: 100%; max-height: 50vh; justify-self: center; border-radius: var(--r-md); -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }

/* start screen */
#drop { position: fixed; z-index: var(--z-fab); left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h)); bottom: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 var(--gr) calc(env(safe-area-inset-bottom, 0px) + var(--sp-24)) var(--gl); }
.start { width: min(440px, 100%); margin: 0 auto; display: grid; gap: var(--sp-16); }
.bigtype { font: 800 clamp(34px, 10.5vw, 46px)/1.02 var(--font-display); letter-spacing: -.035em; color: var(--text); margin-top: var(--sp-16); }
.bigtype i { font-style: normal; color: var(--primary); }
.dz { position: relative; display: grid; justify-items: center; gap: var(--sp-8); text-align: center; padding: var(--sp-32) var(--sp-16) var(--sp-24); border-radius: var(--r-lg); cursor: pointer;
  border: 1.5px dashed color-mix(in srgb, var(--primary) 45%, var(--outline)); background: var(--safelight-glow), var(--paper); transition: border-color var(--dur-fast) var(--ease), transform var(--dur-short) var(--ease); }
.dz > .ico { color: var(--primary); }
.dz .btn { margin-top: var(--sp-4); pointer-events: none; }
.dz:hover, #drop.over .dz { border-color: var(--primary); }
#drop.over .dz { transform: scale(1.02); }
.dz:focus-within { box-shadow: var(--focus-ring); }
#trySample { min-height: var(--target); display: inline-flex; align-items: center; }
#drop.replace { z-index: 1250; inset: 0; background: var(--scrim); display: grid; align-content: center; }
#drop.replace .bigtype, #drop.replace .start-more, #drop.replace .presetgrid { display: none; }
#fatal { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-secondary); }
</style>
</head>

<canvas id="gl" class="stage" aria-label="Photograph being edited. One finger edits the selected light, blur or mask; two fingers pan and zoom."></canvas>
<canvas id="ov" class="stage" aria-hidden="true"></canvas>
<div id="drop" hidden>
  <div class="start">
    <h1 class="bigtype">Add light<br>to the <i>night.</i></h1>
    <label class="dz">
      <svg class="ico ico--xl" aria-hidden="true"><use href="#i-upload"/></svg>
      <span class="t-h6" id="dropTitle">Add a photograph</span>
      <span class="t-body2" id="dropHint">Drop a JPEG, PNG or WebP here, or tap to choose one from your photos.</span>
      <span class="btn btn-contained"><svg class="ico" aria-hidden="true"><use href="#i-image"/></svg>Choose a photo</span>
      <input type="file" id="dropFile" class="vh" accept="image/jpeg,image/png,image/webp,.json,application/json">
    </label>
    <div class="row between start-more"><span class="t-overline">Or start from a preset</span><button class="link link-quiet t-caption" id="trySample">Try a sample photo</button></div>
    <div class="grid-2 presetgrid" id="startPresets" style="--gap:var(--sp-8)"></div>
  </div>
  <input type="file" id="presetFile" class="vh" tabindex="-1" aria-hidden="true" accept="image/jpeg,image/png,image/webp">

      g.beginPath(); g.moveTo(base, 0); g.bezierCurveTo(L2 * 0.35, -wid, L2 * 0.86, -wid * 0.8, L2, 0); g.bezierCurveTo(L2 * 0.86, wid * 0.8, L2 * 0.35, wid, base, 0); g.closePath();
      if (sil) { g.fillStyle = sil; g.fill(); } else { const lift = 0.55 + 0.45 * Math.max(0, Math.cos(a + 2.3)), gr = g.createLinearGradient(base, 0, L2, 0);
        gr.addColorStop(0, `hsl(${342 + t * 6},72%,${(6 + t * 8) * lift}%)`); gr.addColorStop(0.55, `hsl(${338 + t * 8},70%,${(17 + t * 12) * lift}%)`); gr.addColorStop(1, `hsl(${333 + t * 10},62%,${(27 + t * 15) * lift}%)`);
        g.fillStyle = gr; g.fill(); g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = Math.max(1, wid * 0.05); g.stroke(); g.beginPath(); g.moveTo(base * 2, 0); g.lineTo(L2 * 0.88, 0); g.strokeStyle = `rgba(255,170,205,${0.05 + 0.05 * lift})`; g.lineWidth = wid * 0.1; g.stroke(); }
      g.restore(); } }
  if (!sil) { const c = g.createRadialGradient(cx, cy, 0, cx, cy, R * 0.13); c.addColorStop(0, "#3a2408"); c.addColorStop(0.6, "#22100c"); c.addColorStop(1, "rgba(30,8,14,0)"); g.fillStyle = c; g.beginPath(); g.arc(cx, cy, R * 0.13, 0, Math.PI * 2); g.fill(); }
}
function drawStem(g, W, H, sil) {
  g.lineCap = "round"; g.strokeStyle = sil || "#0f1c12"; g.lineWidth = W * 0.032; g.beginPath(); g.moveTo(W * 0.53, H * 0.5); g.bezierCurveTo(W * 0.55, H * 0.7, W * 0.44, H * 0.85, W * 0.47, H * 1.05); g.stroke();
  g.save(); g.translate(W * 0.5, H * 0.78); g.rotate(-0.7); g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(W * 0.1, -W * 0.08, W * 0.25, -W * 0.06, W * 0.32, 0); g.bezierCurveTo(W * 0.24, W * 0.06, W * 0.1, W * 0.06, 0, 0); g.fillStyle = sil || "#0c1810"; g.fill(); g.restore();
}
function makeSample() {
  const W = 1500, H = 1875, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  const bg = g.createRadialGradient(W * 0.48, H * 0.4, 0, W * 0.5, H * 0.45, H * 0.8); bg.addColorStop(0, "#17121c"); bg.addColorStop(0.5, "#0b0a0f"); bg.addColorStop(1, "#030305"); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const r = rng(3); for (let i = 0; i < 16; i++) { const x = r() * W, y = r() * H, rad = W * (0.06 + r() * 0.16), b = g.createRadialGradient(x, y, 0, x, y, rad); b.addColorStop(0, `rgba(${22 + r() * 20},${38 + r() * 25},${30 + r() * 12},.35)`); b.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = b; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  drawStem(g, W, H); drawDahlia(g, W * 0.52, H * 0.4, W * 0.34);
  const id = g.getImageData(0, 0, W, H), d = id.data, nr = rng(11); for (let i = 0; i < d.length; i += 4) { const n = (nr() - 0.5) * 7; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(id, 0, 0); return c;
}
function sampleSubject() { // the generated flower's own outline, used for the sample's starting lights
  const { w, h, mw, mh } = state.doc, c = document.createElement("canvas"); c.width = mw; c.height = mh; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, mw, mh); g.scale(mw / w, mh / h); drawStem(g, w, h, "#fff"); drawDahlia(g, w * 0.52, h * 0.4, w * 0.34, "#fff");
  const px = g.getImageData(0, 0, mw, mh).data, out = new Uint8Array(mw * mh); for (let i = 0; i < out.length; i++) out[i] = px[i * 4]; return out;
}

/* ═════════════════════════ boot ═════════════════════════ */
// After a photo or project opens: hide the drop zone, bring the sheet up, fit the photo above it.
function showEditor() {
  const first = state.ui === "none"; $("#drop").hidden = true; $("#drop").classList.remove("replace", "over");
  if (first) state.ui = "list"; renderPanel(); fitView();
  if (first && motionOK()) $("#sheet").animate([{ transform: "translateY(100%)" }, { transform: "none" }], { duration: 380, easing: EASE });
}
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); if (dragDepth++ === 0) { const d = $("#drop"); d.classList.add("over"); if (d.hidden) { d.classList.add("replace"); d.hidden = false; $("#dropTitle").textContent = "Drop to open"; $("#dropHint").textContent = "Your lights carry over to the new photo."; } } });
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) endDrag(); });
addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); endDrag(); const f = e.dataTransfer.files[0]; if (f) openAny(f); });
function endDrag() { dragDepth = 0; const d = $("#drop"); d.classList.remove("over"); if (d.classList.contains("replace")) { d.classList.remove("replace"); d.hidden = true; $("#dropTitle").textContent = "Add a photograph"; $("#dropHint").textContent = DROP_HINT; } }
$("#trySample").onclick = () => loadSample().catch(err => toast(err.message));
// Start-screen presets: choose the photo first, then the preset is applied to it.
let pendingPreset = null;
$("#startPresets").addEventListener("click", e => { const c = e.target.closest("[data-start-preset]"); if (!c) return; pendingPreset = c.dataset.startPreset; $("#presetFile").click(); });
$("#presetFile").addEventListener("change", async e => { const f = e.target.files[0], id = pendingPreset; e.target.value = ""; pendingPreset = null; if (f && id && await openPhoto(f)) applyPreset(id); });

const DROP_HINT = matchMedia("(pointer: coarse)").matches ? "Choose a JPEG, PNG or WebP photo from your library." : "Drop a JPEG, PNG or WebP here, or click to choose one.";
async function boot() {
  $("#dropHint").textContent = DROP_HINT; $("#startPresets").innerHTML = presetCards("data-start-preset"); resize(); $("#drop").hidden = false; renderPanel(); requestAnimationFrame(loop);
}
async function loadSample() {
  const url = makeSample().toDataURL("image/jpeg", 0.92), img = await loadImage(url); setDocument(img, url, "dahlia-sample");
  const subj = sampleSubject(), sm = (density = 1) => ({ pieces: [newPiece("subject", { invert: true, data: subj })], density, feather: 0.004, invert: false });
  const halo = makeLayer("Halo · 3200K", radialLight({ x: 0.36, y: 0.3, rx: 0.42, ry: 0.36, angle: -0.5, soft: 0.95 }), { opacity: 0.85, blurs: [radialBlur(0.35, 0.52, 0.4), gaussBlur(0.02)], mask: sm() });
  const win = makeLayer("Window beams", imageLight(await libraryAsset("window"), { x: 0.74, y: 0.14, scale: 0.42, angle: 0.15 }), { opacity: 0.7, blurs: [radialBlur(0.6, 1.12, -0.14)], mask: sm(0.6) });
  state.layers = [halo, win]; state.activeId = win.id;
  resetHistory(); showEditor(); markDirty();
  toast("Sample photo with two lights. Tap a light to edit it.", 3600);
}
addEventListener("resize", () => { resize(); if (assets.has("base")) fitView(); });
boot().catch(err => { document.body.insertAdjacentHTML("beforeend", `<div id="fatal"><p>${esc(err.message)}</p></div>`); console.error(err); });
</script>
