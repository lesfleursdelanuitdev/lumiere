<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c12">
<meta name="description" content="Lumière by Les Fleurs de la Nuit: add and shape light in your photographs, on your phone.">
<title>Lumière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; }
/* Layout: the photograph fills the screen. One bottom sheet moves between three states:
   a small bar → the list of lights → the editor for one light. */
:root {
  --ink: #0d0c12;
  --surface: #17151d;
  --raise: #221f2a;
  --line: #2f2b39;
  --text: #ece6f1;
  --muted: #9d95aa;
  --tungsten: #f2b56b;
  --tungsten-ink: #1c1306;
  --mask: #f0506e;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-mark: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--text); font-family: var(--f-ui); font-size: 14px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas.stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#ov { pointer-events: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, label.btn:focus-within { outline: 2px solid var(--tungsten); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 4px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: linear-gradient(var(--ink), color-mix(in srgb, var(--ink) 0%, transparent)); }
#mark { margin-right: auto; display: grid; line-height: 1; gap: 3px; min-width: 0; }
#mark b { font-family: var(--f-mark); font-style: italic; font-weight: 500; font-size: 24px; color: var(--tungsten); white-space: nowrap; }
#mark small { font-size: 10px; letter-spacing: .02em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 36px; height: 40px; display: grid; place-items: center; border-radius: 10px; }
.icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.icon:disabled { opacity: .35; cursor: default; }
#exportBtn { height: 36px; padding: 0 13px; border-radius: 18px; background: var(--tungsten); color: var(--tungsten-ink); font-weight: 600; margin-left: 6px; }

.float { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 56px); font: 500 11px/1 var(--f-num); border-radius: 12px; padding: 6px 9px; }
#perf { left: var(--gutter-l); color: var(--muted); background: color-mix(in srgb, var(--ink) 78%, transparent); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
#perf b { color: var(--text); font-weight: 500; }
#perf.good b.fps { color: #8fd694; } #perf.ok b.fps { color: var(--tungsten); } #perf.slow b.fps { color: var(--mask); }
#soloTag { right: var(--gutter-r); color: var(--tungsten-ink); background: var(--tungsten); }

#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -12px 40px rgb(0 0 0 / .35); }
#panel { max-height: min(48vh, 400px); overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--gutter-r) 12px var(--gutter-l); display: grid; gap: 12px; }
#sheet.peek #panel { display: none; }
#peek { padding: 12px var(--gutter-r) 12px var(--gutter-l); font: 500 12px var(--f-num); color: var(--muted); font-variant-numeric: tabular-nums; }
#peek b { color: var(--tungsten); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { #panel.slide-in { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(14px); opacity: .4; } } }

.sticky { position: sticky; top: 0; z-index: 2; background: var(--surface); padding-top: 12px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.hint { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0; max-width: 62ch; }
.note { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 0; line-height: 1.45; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding-top: 10px; }
.bar button { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--raise); font-weight: 500; }
.bar .count { font: 500 12px var(--f-num); color: var(--muted); margin-left: auto; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--raise); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); }
.seg.small button { padding: 6px 2px; font-size: 12px; }
.seg.tabs { background: none; padding: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
.seg.tabs button { border-radius: 0; padding: 10px 4px; border-bottom: 2px solid transparent; }
.seg.tabs button[aria-pressed="true"] { background: none; color: var(--tungsten); border-bottom-color: var(--tungsten); }
.seg.tabs small { font: 500 11px var(--f-num); color: var(--muted); margin-left: 4px; }

.slider { display: grid; gap: 4px; }
.slider .row { justify-content: space-between; font-size: 13px; }
.slider output { font: 500 12px var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; touch-action: pan-x; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; background: var(--text); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 3px solid var(--surface); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 18px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip, label.btn { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 10px; background: var(--raise); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--tungsten) 18%, var(--raise)); color: var(--tungsten); }
.chip.primary { background: var(--tungsten); color: var(--tungsten-ink); font-weight: 600; }
.chip.danger { color: var(--mask); }
.chip:disabled { opacity: .5; cursor: progress; }
.chip.small { padding: 6px 9px; font-size: 12px; }
label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.readout { font: 500 12px var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); }
.readout b { color: var(--tungsten); font-weight: 500; }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { display: grid; justify-items: center; gap: 4px; font: 500 10.5px var(--f-num); color: var(--muted); }
.sw i { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--tungsten); }
.sw input { width: 32px; height: 32px; border: 0; padding: 0; border-radius: 50%; background: none; }
.sw input::-webkit-color-swatch-wrapper { padding: 0; } .sw input::-webkit-color-swatch { border-radius: 50%; border: 2px solid var(--surface); }

/* light list */
.lights { display: grid; gap: 4px; }
.light { display: grid; grid-template-columns: 30px 52px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 4px; border-radius: 12px; }
.light.dragging { background: var(--raise); box-shadow: 0 0 0 1px var(--tungsten); }
.grip { width: 30px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.thumb { width: 52px; height: 52px; border-radius: 8px; background: #000; border: 1px solid var(--line); object-fit: cover; display: block; }
.light .name { text-align: left; min-width: 0; padding: 6px 0; }
.light .name b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.light .name small { color: var(--muted); font-size: 11.5px; }
.eye { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.eye[aria-pressed="false"] { opacity: .4; }
.photo-row { display: grid; grid-template-columns: 30px 52px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 4px; color: var(--muted); }

/* editor */
.ed-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 6px; touch-action: pan-y; }
.back { display: inline-flex; align-items: center; gap: 2px; padding: 8px 8px 8px 0; color: var(--muted); font-weight: 500; }
.ed-title { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
.ed-title b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-title .pos { font: 500 11px var(--f-num); color: var(--muted); white-space: nowrap; }
.nav { width: 30px; height: 34px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.nav:disabled { opacity: .25; }

.items { display: grid; gap: 6px; }
.item { border-radius: 12px; background: var(--raise); }
.item > .row { padding: 6px 6px 6px 12px; min-height: 46px; }
.item[aria-current="true"] { box-shadow: 0 0 0 1px var(--tungsten); }
.item .what { text-align: left; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.item .what span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .what small { color: var(--muted); font: 500 11px var(--f-num); }
.item .tool { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.item .tool:disabled { opacity: .25; }
.item .tool[aria-pressed="false"] { opacity: .45; }
.item .body { padding: 2px 12px 12px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.mode { display: inline-grid; grid-auto-flow: column; background: var(--surface); border-radius: 8px; padding: 2px; }
.mode button { padding: 4px 7px; font: 500 11px var(--f-num); color: var(--muted); border-radius: 6px; }
.mode button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.base-tag { font: 500 11px var(--f-num); color: var(--muted); padding: 4px 7px; }

.libs { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.libs button, .libs label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); text-align: center; position: relative; }
.libs img, .libs .add { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: #000; object-fit: cover; display: grid; place-items: center; }
.libs [aria-pressed="true"] img { box-shadow: 0 0 0 2px var(--tungsten); }
.libs label input { position: absolute; width: 1px; height: 1px; opacity: 0; }

#toast { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 58px); max-width: calc(100% - 32px);
  background: var(--raise); border: 1px solid var(--line); padding: 9px 14px; border-radius: 12px; font-size: 13px; }
#modal { position: fixed; inset: 0; z-index: 8; background: rgb(5 4 8 / .72); display: grid; place-items: end center; }
#modal .card { width: min(560px, 100%); max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line);
  padding: 18px var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 18px) var(--gutter-l); display: grid; gap: 14px; }
#modal h3 { margin: 0; font-size: 16px; font-weight: 600; }
#modal .opts { display: grid; gap: 8px; }
#modal .opt { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--raise); }
#modal .opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
#modal .opt span.fmt { font: 500 12px var(--f-num); color: var(--tungsten); }
.presets { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.preset { display: grid; gap: 8px; text-align: left; padding: 8px; border-radius: 14px; background: var(--raise); }
.preset i { display: block; aspect-ratio: 4/3; border-radius: 9px; border: 1px solid var(--line); }
.preset b { font-weight: 600; font-size: 13.5px; } .preset small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 2px; }
.preset .tag { font: 500 10.5px var(--f-num); color: var(--muted); }
#modal img.result { max-width: 100%; max-height: 50vh; justify-self: center; border-radius: 8px; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
#fatal { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<canvas id="gl" class="stage" aria-label="Photograph being edited. One finger edits the selected light, blur or mask; two fingers pan and zoom."></canvas>
<canvas id="ov" class="stage" aria-hidden="true"></canvas>

<header id="top">
  <div id="mark"><b>Lumière</b><small>by Les Fleurs de la Nuit</small></div>
  <button class="icon" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="icon" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <label class="icon" title="Open a photo or project" aria-label="Open a photo or project"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-4.5-4.5L8 19"/></svg><input id="openFile" type="file" accept="image/jpeg,image/png,image/webp,.json,application/json" hidden></label>
  <button id="exportBtn">Export</button>
</header>
<div id="perf" class="float" hidden></div>
<div id="soloTag" class="float" hidden>This light alone</div>
<div id="toast" hidden></div>
<section id="sheet"><div id="peek" hidden></div><div id="panel"></div></section>
<div id="modal" hidden></div>

<script>
"use strict";
/* ═════════════════════════ constants ═════════════════════════ */
const BLENDS = [["screen", "Screen"], ["overlay", "Overlay"], ["lighten", "Lighten"], ["dodge", "Color Dodge"]];
const BLEND_ID = { screen: 0, overlay: 1, lighten: 2, dodge: 3 };
const SWATCHES = [["1900K", "#ff8400"], ["2700K", "#ffa757"], ["3200K", "#ffb87b"], ["5600K", "#ffefe1"], ["7500K", "#e6ebff"], ["Magenta", "#ff4fa8"], ["Cyan", "#4fd2ff"]];
const PREVIEW_LONG = 1600, MASK_LONG = 1024, THUMB = 104;
const TFJS_URL = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js";
const MODEL_URL = "models/u2netp.json"; // U²-Net-p salient object model (Apache-2.0), published next to this page
const PIECES = { subject: "Subject", object: "Object", brush: "Brush", radial: "Radial gradient", linear: "Linear gradient" };
const IC = {
  grip: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3"/></svg>',
  eyeOn: '<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.8M6.5 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.4-1"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg>', down: '<svg class="i" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg>',
  del: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  dup: '<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  left: '<svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>', right: '<svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  layers: '<svg class="i" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  spark: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  invert: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
};

/* ═════════════════════════ state ═════════════════════════ */
const state = {
  doc: { w: 0, h: 0, pw: 0, ph: 0, mw: 0, mh: 0, name: "photo" },
  layers: [],            // bottom → top. Each: { light, blurs[], mask{pieces[],density,feather,invert}, blend, opacity }
  activeId: null,
  ui: "list",            // bar | list | editor
  section: "light",      // light | blurs | mask (inside the editor)
  focus: null,           // id of the blur or mask piece being edited
  drawing: null,         // { kind: "light" } or { kind: "piece", id }: the next drag draws that shape
  solo: false, showMask: true, fine: false,
  brush: { size: 0.05, hard: 0.5, flow: 0.7, erase: false },
  view: { zoom: 1, x: 0, y: 0 }, interacting: false,
};
const assets = new Map(); // key → { img, w, h, tex, dataURL }
let nextId = 1; const uid = () => "i" + (nextId++);
const $ = s => document.querySelector(s);
const activeLayer = () => state.layers.find(l => l.id === state.activeId) || null;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ═════════════════════════ WebGL ═════════════════════════ */
const glCanvas = $("#gl");
const gl = glCanvas.getContext("webgl2", { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) { document.body.insertAdjacentHTML("beforeend", '<div id="fatal"><p>This browser does not offer WebGL2, which Lumière needs. Try a current Safari, Chrome or Firefox.</p></div>'); throw new Error("no webgl2"); }
const VS = `#version 300 es
in vec2 aPos; out vec2 vUV; void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;
const HEAD = `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
vec2 rot(vec2 v, float a){ float c=cos(a), s=sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
`;
const SAMPLE = `vec4 S(vec2 uv){ if(uv.x<0.0||uv.y<0.0||uv.x>1.0||uv.y>1.0) return vec4(0.0); return texture(uSrc, uv); }
vec4 SC(vec2 uv){ return texture(uSrc, clamp(uv,0.0,1.0)); }`;
const FS = {
  copy: HEAD + `uniform sampler2D uSrc; void main(){ o = vec4(texture(uSrc, vUV).rgb, 1.0); }`,
  // One light, alone, premultiplied: an elliptical radial gradient or a placed image.
  gen: HEAD + `
uniform int uType; uniform vec2 uSize; uniform vec3 uColor; uniform float uExposure;
uniform vec2 uC; uniform vec2 uR; uniform float uAng; uniform float uSoft; uniform sampler2D uTex; uniform vec2 uHalf;
void main(){
  vec2 px = vUV*uSize; float L = max(uSize.x, uSize.y); float n = (hash(px)-0.5)/255.0;

  const t0 = performance.now(), blob = await renderFull(k); st.textContent = `Rendered in ${((performance.now() - t0) / 1000).toFixed(1)} s.`; await offer(`${name}-lit.${k}`, blob, blob);
});

/* ═════════════════════════ sample photograph ═════════════════════════ */
function drawDahlia(g, cx, cy, R, sil) {
  const r = rng(7);
  for (let k = 0; k < 10; k++) { const t = k / 9, n = Math.round(24 - t * 11), len = R * (1 - t * 0.8), wid = len * (0.34 - t * 0.06), off = (k % 2) * Math.PI / n + k * 0.37;
    for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2 + (r() - 0.5) * 0.12, L2 = len * (0.92 + r() * 0.12); g.save(); g.translate(cx, cy); g.rotate(a); const base = L2 * 0.06;
      g.beginPath(); g.moveTo(base, 0); g.bezierCurveTo(L2 * 0.35, -wid, L2 * 0.86, -wid * 0.8, L2, 0); g.bezierCurveTo(L2 * 0.86, wid * 0.8, L2 * 0.35, wid, base, 0); g.closePath();
      if (sil) { g.fillStyle = sil; g.fill(); } else { const lift = 0.55 + 0.45 * Math.max(0, Math.cos(a + 2.3)), gr = g.createLinearGradient(base, 0, L2, 0);
        gr.addColorStop(0, `hsl(${342 + t * 6},72%,${(6 + t * 8) * lift}%)`); gr.addColorStop(0.55, `hsl(${338 + t * 8},70%,${(17 + t * 12) * lift}%)`); gr.addColorStop(1, `hsl(${333 + t * 10},62%,${(27 + t * 15) * lift}%)`);
        g.fillStyle = gr; g.fill(); g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = Math.max(1, wid * 0.05); g.stroke(); g.beginPath(); g.moveTo(base * 2, 0); g.lineTo(L2 * 0.88, 0); g.strokeStyle = `rgba(255,170,205,${0.05 + 0.05 * lift})`; g.lineWidth = wid * 0.1; g.stroke(); }
      g.restore(); } }
  if (!sil) { const c = g.createRadialGradient(cx, cy, 0, cx, cy, R * 0.13); c.addColorStop(0, "#3a2408"); c.addColorStop(0.6, "#22100c"); c.addColorStop(1, "rgba(30,8,14,0)"); g.fillStyle = c; g.beginPath(); g.arc(cx, cy, R * 0.13, 0, Math.PI * 2); g.fill(); }
}
function drawStem(g, W, H, sil) {
  g.lineCap = "round"; g.strokeStyle = sil || "#0f1c12"; g.lineWidth = W * 0.032; g.beginPath(); g.moveTo(W * 0.53, H * 0.5); g.bezierCurveTo(W * 0.55, H * 0.7, W * 0.44, H * 0.85, W * 0.47, H * 1.05); g.stroke();
  g.save(); g.translate(W * 0.5, H * 0.78); g.rotate(-0.7); g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(W * 0.1, -W * 0.08, W * 0.25, -W * 0.06, W * 0.32, 0); g.bezierCurveTo(W * 0.24, W * 0.06, W * 0.1, W * 0.06, 0, 0); g.fillStyle = sil || "#0c1810"; g.fill(); g.restore();
}
function makeSample() {
  const W = 1500, H = 1875, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  const bg = g.createRadialGradient(W * 0.48, H * 0.4, 0, W * 0.5, H * 0.45, H * 0.8); bg.addColorStop(0, "#17121c"); bg.addColorStop(0.5, "#0b0a0f"); bg.addColorStop(1, "#030305"); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const r = rng(3); for (let i = 0; i < 16; i++) { const x = r() * W, y = r() * H, rad = W * (0.06 + r() * 0.16), b = g.createRadialGradient(x, y, 0, x, y, rad); b.addColorStop(0, `rgba(${22 + r() * 20},${38 + r() * 25},${30 + r() * 12},.35)`); b.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = b; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  drawStem(g, W, H); drawDahlia(g, W * 0.52, H * 0.4, W * 0.34);
  const id = g.getImageData(0, 0, W, H), d = id.data, nr = rng(11); for (let i = 0; i < d.length; i += 4) { const n = (nr() - 0.5) * 7; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(id, 0, 0); return c;
}
function sampleSubject() { // the generated flower's own outline, used for the sample's starting lights
  const { w, h, mw, mh } = state.doc, c = document.createElement("canvas"); c.width = mw; c.height = mh; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, mw, mh); g.scale(mw / w, mh / h); drawStem(g, w, h, "#fff"); drawDahlia(g, w * 0.52, h * 0.4, w * 0.34, "#fff");
  const px = g.getImageData(0, 0, mw, mh).data, out = new Uint8Array(mw * mh); for (let i = 0; i < out.length; i++) out[i] = px[i * 4]; return out;
}

/* ═════════════════════════ boot ═════════════════════════ */
async function boot() {
  resize();
  const url = makeSample().toDataURL("image/jpeg", 0.92), img = await loadImage(url); setDocument(img, url, "dahlia-sample");
  const subj = sampleSubject(), sm = (density = 1) => ({ pieces: [newPiece("subject", { invert: true, data: subj })], density, feather: 0.004, invert: false });
  const halo = makeLayer("Halo · 3200K", radialLight({ x: 0.36, y: 0.3, rx: 0.42, ry: 0.36, angle: -0.5, soft: 0.95 }), { opacity: 0.85, blurs: [radialBlur(0.35, 0.52, 0.4), gaussBlur(0.02)], mask: sm() });
  const win = makeLayer("Window beams", imageLight(await libraryAsset("window"), { x: 0.74, y: 0.14, scale: 0.42, angle: 0.15 }), { opacity: 0.7, blurs: [radialBlur(0.6, 1.12, -0.14)], mask: sm(0.6) });
  state.layers = [halo, win]; state.activeId = win.id; state.ui = "list";
  resetHistory(); renderPanel(); fitView(); requestAnimationFrame(loop);
  toast("Sample photo with two lights. Tap a light to edit it, or open your own photo.", 4200);
}
addEventListener("resize", () => { resize(); fitView(); });
boot().catch(err => { document.body.insertAdjacentHTML("beforeend", `<div id="fatal"><p>${esc(err.message)}</p></div>`); console.error(err); });
</script>
</body>
